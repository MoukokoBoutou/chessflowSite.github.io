<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090d">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Ouvrir une ouverture ChessFlow dans l'application Android.">
  <link rel="canonical" href="https://chessflow.fr/opening/">
  <link rel="alternate" hreflang="fr" href="https://chessflow.fr/opening/">
  <link rel="alternate" hreflang="en" href="https://chessflow.fr/opening/en/">
  <link rel="alternate" hreflang="x-default" href="https://chessflow.fr/opening/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ChessFlow">
  <meta property="og:title" content="Ouverture ChessFlow">
  <meta property="og:description" content="Ouvrez cette ouverture dans ChessFlow.">
  <meta property="og:image" content="https://chessflow.fr/assets/chessflow-og-fr.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <title>Ouverture ChessFlow</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/language-redirect.js" data-preserve-path-tail="true"></script>
  <script src="/assets/deep-link.js" defer></script>
  <script src="/assets/board-preview.js" defer></script>
</head>
<body class="puzzle-link-page deep-link-board-page" data-deep-link-kind="opening" data-deep-link-language="fr">
  <main class="puzzle-open-main">
    <section class="puzzle-open-card">
      <img src="/assets/chessflow-icon.png" alt="" width="72" height="72">
      <div class="language-switcher" aria-label="Choisir la langue">
        <a id="language-fr-link" href="/opening/" lang="fr" hreflang="fr" aria-current="page">FR</a>
        <a id="language-en-link" href="/opening/en/" lang="en" hreflang="en">EN</a>
      </div>
      <h1>Leçon ChessFlow</h1>
      <p id="opening-open-message" data-deep-link-status role="status" aria-live="polite" aria-atomic="true">Ouvrez cette leçon dans ChessFlow.</p>
      <div class="puzzle-board-shell" data-board-preview>
        <div class="puzzle-board-loading">Chargement de la position…</div>
        <div class="puzzle-board-preview" data-preview-board role="img" aria-label="Position de présentation de l’ouverture"></div>
      </div>
      <div class="puzzle-open-actions">
        <a class="button button-primary" id="open-app-link" data-deep-link-button href="https://play.google.com/store/apps/details?id=com.rolf.ChessFlow">Ouvrir ou installer ChessFlow</a>
      </div>
      <a class="legal-back" href="/">← Retour au site</a>
    </section>
  </main>
</body>
</html>
