<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090d">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Open a ChessFlow puzzle in the Android app.">
  <link rel="canonical" href="https://chessflow.fr/puzzle/en/">
  <link rel="alternate" hreflang="fr" href="https://chessflow.fr/puzzle/">
  <link rel="alternate" hreflang="en" href="https://chessflow.fr/puzzle/en/">
  <link rel="alternate" hreflang="x-default" href="https://chessflow.fr/puzzle/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ChessFlow">
  <meta property="og:title" content="ChessFlow puzzle">
  <meta property="og:description" content="Open this puzzle in ChessFlow.">
  <meta property="og:image" content="https://chessflow.fr/assets/chessflow-og-en.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <title>ChessFlow puzzle</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/language-redirect.js" data-preserve-path-tail="true"></script>
  <script src="/assets/deep-link.js" defer></script>
  <script src="/assets/puzzle-preview.js" defer></script>
</head>
<body class="puzzle-link-page" data-deep-link-kind="puzzle" data-deep-link-language="en">
  <main class="puzzle-open-main">
    <section class="puzzle-open-card">
      <img src="/assets/chessflow-icon.png" alt="" width="72" height="72">
      <div class="language-switcher" aria-label="Choose language">
        <a id="language-fr-link" href="/puzzle/" lang="fr" hreflang="fr">FR</a>
        <a id="language-en-link" href="/puzzle/en/" lang="en" hreflang="en" aria-current="page">EN</a>
      </div>
      <h1>ChessFlow puzzle</h1>
      <p id="puzzle-open-message" data-deep-link-status role="status" aria-live="polite" aria-atomic="true">Open this puzzle in ChessFlow.</p>
      <div class="puzzle-board-shell" data-puzzle-preview>
        <div class="puzzle-board-loading" data-puzzle-loading>Loading position…</div>
        <div class="puzzle-board-preview" data-puzzle-board role="img" aria-label="Puzzle starting position"></div>
      </div>
      <div class="puzzle-open-actions">
        <a class="button button-primary" id="open-app-link" data-deep-link-button href="https://play.google.com/store/apps/details?id=com.rolf.ChessFlow">Open or install ChessFlow</a>
      </div>
      <a class="legal-back" href="/en.html">← Back to site</a>
    </section>
  </main>
</body>
</html>
